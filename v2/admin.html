<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>SAS STOCK – Licences</title>
<style>
body{margin:0;background:#F1F4EF;color:#10261F;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:#10261F;color:#fff;padding:16px;font-weight:800;font-size:1.2rem}
main{max-width:720px;margin:0 auto;padding:16px 14px 60px}
.carte{background:#fff;border:1px solid #D9E1D9;border-radius:14px;padding:14px;margin-bottom:10px}
button{font:inherit;font-weight:650;border:1px solid #D9E1D9;background:#fff;color:#10261F;border-radius:10px;padding:8px 12px;min-height:40px;cursor:pointer}
button.p{background:#0E7A53;border-color:#0E7A53;color:#fff}
button.d{color:#C2362C;border-color:#E9BDB8}
.r{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.e{font-weight:700;word-break:break-all}
.s{color:#5A6D64;font-size:.86rem}
.ok{color:#0A5C3E;font-weight:700}.ko{color:#C2362C;font-weight:700}
input{font:inherit;width:100%;box-sizing:border-box;border:1.5px solid #D9E1D9;border-radius:10px;padding:10px;margin-bottom:10px}
</style>
</head>
<body>
<header>SAS STOCK – Licences des boutiques</header>
<main>
<p id="msg" class="s">Chargement…</p>
<div id="outils" hidden><input id="q" placeholder="Chercher une adresse e-mail ou un nom"><button id="maj">Actualiser la liste</button> <button id="sortir">Se déconnecter</button></div>
<div id="liste" style="margin-top:12px"></div>
</main>
<script type="module" src="fb.js"></script>
<script type="module">
const $ = id => document.getElementById(id), J = 864e5, VIE = Date.UTC(2099, 0, 1);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dj = t => new Date(t).toLocaleDateString('fr-FR');
let L = [];
function etat(b) {
  if (!b.fin) return '<span class="ko">Pas encore activée</span>';
  if (b.fin >= VIE - J) return '<span class="ok">Licence à vie</span>';
  const r = Math.ceil((b.fin - Date.now()) / J);
  return r > 0 ? '<span class="ok">Active jusqu’au ' + dj(b.fin) + ' (' + r + ' j)</span>' : '<span class="ko">Expirée ou bloquée depuis le ' + dj(b.fin) + '</span>';
}
function afficher() {
  const q = $('q').value.trim().toLowerCase(), V = L.filter(b => !q || (b.email + ' ' + b.nom).toLowerCase().includes(q));
  $('liste').innerHTML = V.length ? V.map(b => '<div class="carte"><div class="e">' + esc(b.email || b.uid) + '</div><div class="s">' + esc(b.nom) + (b.vu ? ', vue le ' + dj(b.vu) : '') + '</div><div>' + etat(b) + '</div><div class="r" data-u="' + esc(b.uid) + '">' +
    '<button data-j="7">+ 7 jours</button><button data-m="1">+ 1 mois</button><button data-m="3">+ 3 mois</button><button data-m="6">+ 6 mois</button><button class="p" data-m="12">+ 1 an</button><button data-v="1">À vie</button><button class="d" data-b="1">Bloquer</button></div></div>').join('') : '<p class="s">Aucune boutique. Une boutique apparaît ici dès que son propriétaire se connecte avec Google dans l’application.</p>';
}
async function charger() {
  $('msg').textContent = 'Chargement…';
  try { L = (await FB.boutiques()).sort((a, b) => (a.fin || 0) - (b.fin || 0)); $('msg').textContent = L.length + ' boutique(s)'; $('outils').hidden = false; afficher(); }
  catch (e) { $('outils').hidden = true; $('liste').innerHTML = ''; $('msg').textContent = 'Accès refusé : cette page est réservée au compte vendeur.'; }
}
$('liste').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  const uid = b.parentElement.dataset.u, x = L.find(y => y.uid === uid), d = b.dataset; let fin;
  if (d.v) fin = VIE; else if (d.b) fin = Date.now() - 1000;
  else { const base = new Date(Math.max(Date.now(), x.fin && x.fin < VIE - J ? x.fin : 0)); if (d.j) base.setDate(base.getDate() + +d.j); else base.setMonth(base.getMonth() + +d.m); fin = base.getTime(); }
  b.disabled = true;
  try { await FB.licence(uid, fin); x.fin = fin; afficher(); } catch (er) { $('msg').textContent = 'Échec : ' + er.message; b.disabled = false; }
});
$('q').addEventListener('input', afficher); $('maj').addEventListener('click', charger); $('sortir').addEventListener('click', () => FB.deconnecter());
const pret = () => FB.onUser(u => { if (u) charger(); else { $('outils').hidden = true; $('liste').innerHTML = '<button class="p" id="go">Se connecter avec Google</button>'; $('msg').textContent = 'Connectez-vous avec le compte vendeur.'; $('go').onclick = () => FB.connecter().catch(() => {}); } });
if (window.FB) pret(); else addEventListener('fb-pret', pret, { once: true });
</script>
</body>
</html>
