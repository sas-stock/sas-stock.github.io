<style>
:root{
  --fond:#F1F4EF; --surface:#fff; --encre:#10261F; --doux:#5A6D64; --trait:#D9E1D9;
  --vert:#0E7A53; --vert-f:#0A5C3E; --vert-p:#E3F2EA; --mangue:#F2A413; --mangue-p:#FDF1D6;
  --rouge:#C2362C; --rouge-p:#FBE6E3; --r:14px; --nav:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--fond);color:var(--encre);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3,p{margin:0}
h1{font-size:1.5rem;line-height:1.2;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.06rem;font-weight:750}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--mangue);outline-offset:2px}
.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.doux{color:var(--doux)} .petit{font-size:.84rem} .gras{font-weight:700}
.rouge{color:var(--rouge)} .vert{color:var(--vert)}
.droite{text-align:right} .centre{text-align:center}
[hidden]{display:none!important}

/* ---- ossature ---- */
#app{min-height:100%}
.tete{position:sticky;top:0;z-index:20;background:var(--encre);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top))}
.tete .logo{width:32px;height:32px;flex:none}
.tete .nomb{flex:1;min-width:0}
.tete .nomb b{display:block;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tete .nomb span{font-size:.76rem;opacity:.7}
.tete .moi{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:99px;padding:7px 12px;font-size:.85rem;font-weight:600;max-width:42vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bandeau{background:var(--mangue-p);border-bottom:1px solid #EDD292;padding:9px 14px;font-size:.88rem;display:flex;gap:10px;align-items:center;justify-content:space-between}
.bandeau button{border:0;background:var(--encre);color:#fff;border-radius:8px;padding:6px 10px;font-size:.82rem;font-weight:650;flex:none}
main{padding:16px 14px calc(var(--nav) + 28px);max-width:1080px;margin:0 auto}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--trait);display:flex}
.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.7rem;font-weight:650;color:var(--doux)}
.nav button svg{width:24px;height:24px}
.nav button i{display:grid;place-items:center;width:52px;height:30px;border-radius:99px}
.nav button.on{color:var(--vert-f)} .nav button.on i{background:var(--vert-p)}
.nav .sec{display:none}
@media(min-width:900px){
  .nav{top:0;right:auto;width:216px;height:auto;flex-direction:column;border-top:0;border-right:1px solid var(--trait);padding:70px 10px 10px;gap:2px}
  .nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:10px;font-size:.94rem;padding:6px;border-radius:10px}
  .nav button i{width:38px;height:34px;border-radius:9px}
  .nav button.on{background:var(--vert-p)} .nav .sec{display:flex} .nav .plus{display:none}
  .tete{z-index:40} main{margin-left:216px;padding:24px 28px 40px;max-width:none}
}

/* ---- éléments ---- */
.titre{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.carte{background:var(--surface);border:1px solid var(--trait);border-radius:var(--r);padding:14px}
.carte + .carte, .bloc + .bloc{margin-top:12px}
.bloc > h2{margin:18px 2px 8px}
.grille{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.grille{grid-template-columns:repeat(4,1fr)}}
.chiffre{background:var(--surface);border:1px solid var(--trait);border-radius:var(--r);padding:12px 14px}
.chiffre span{display:block;font-size:.8rem;color:var(--doux)}
.chiffre b{display:block;font-size:1.22rem;font-weight:800;letter-spacing:-.01em;margin-top:2px}
.chiffre.fort{background:var(--encre);border-color:var(--encre);color:#fff;grid-column:span 2}
.chiffre.fort span{color:#B9CCC2} .chiffre.fort b{font-size:1.9rem;color:var(--mangue)}
.btn{border:1px solid var(--trait);background:var(--surface);border-radius:12px;padding:11px 14px;font-weight:650;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--encre)}
.btn svg{width:20px;height:20px;flex:none}
.btn.p{background:var(--vert);border-color:var(--vert);color:#fff} .btn.p:active{background:var(--vert-f)}
.btn.m{background:var(--mangue);border-color:var(--mangue);color:var(--encre)}
.btn.d{color:var(--rouge);border-color:#E9BDB8}
.btn.large{width:100%;min-height:54px;font-size:1.05rem}
.btn.mini{min-height:36px;padding:6px 10px;font-size:.86rem;border-radius:9px}
.btn:disabled{opacity:.5}
.rangee{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rangee > .f{flex:1;min-width:0}
.puces{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.puces::-webkit-scrollbar{display:none}
.puce{flex:none;border:1px solid var(--trait);background:var(--surface);border-radius:99px;padding:8px 14px;font-size:.88rem;font-weight:650;color:var(--doux)}
.puce.on{background:var(--encre);border-color:var(--encre);color:#fff}
label.ch{display:block;margin-bottom:12px}
label.ch > span{display:block;font-size:.84rem;font-weight:650;margin-bottom:5px;color:var(--doux)}
input,select,textarea{width:100%;border:1.5px solid var(--trait);background:var(--surface);border-radius:11px;padding:11px 12px;min-height:46px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--vert);box-shadow:0 0 0 3px var(--vert-p)}
input[readonly]{background:var(--fond);color:var(--doux)}
input[type=checkbox]{width:22px;min-height:22px;height:22px;accent-color:var(--vert);flex:none;padding:0}
label.coche{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.cherche{position:relative} .cherche svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--doux)}
.cherche input{padding-left:40px}
.liste{background:var(--surface);border:1px solid var(--trait);border-radius:var(--r);overflow:hidden}
.ligne{display:flex;align-items:center;gap:10px;padding:11px 14px;border:0;border-bottom:1px solid var(--trait);background:none;width:100%;text-align:left;min-height:56px}
.ligne:last-child{border-bottom:0}
button.ligne:active{background:var(--fond)}
.ligne .f{flex:1;min-width:0}
.ligne .f b{display:block;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ligne .f span{display:block;font-size:.82rem;color:var(--doux);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ligne .d{text-align:right;flex:none}
.ligne .d b{display:block;font-weight:750} .ligne .d span{display:block;font-size:.8rem;color:var(--doux)}
.etiq{display:inline-block;border-radius:6px;padding:1px 7px;font-size:.74rem;font-weight:700;background:var(--vert-p);color:var(--vert-f)}
.etiq.al{background:var(--mangue-p);color:#7A5200} .etiq.ko{background:var(--rouge-p);color:var(--rouge)}
.videz{padding:28px 18px;text-align:center;color:var(--doux)}
.videz b{display:block;color:var(--encre);margin-bottom:4px}
table.t{width:100%;border-collapse:collapse;font-size:.92rem}
table.t th{font-size:.78rem;font-weight:650;color:var(--doux);text-align:left;padding:8px 10px;border-bottom:1px solid var(--trait)}
table.t td{padding:9px 10px;border-bottom:1px solid var(--trait)}
table.t tr:last-child td{border-bottom:0}
table.t .d{text-align:right}
.deux{display:grid;gap:12px} @media(min-width:900px){.deux{grid-template-columns:1fr 1fr;align-items:start}}
.compte div{display:flex;justify-content:space-between;gap:10px;padding:7px 0}
.compte .tot{border-top:1.5px solid var(--encre);margin-top:4px;font-weight:800;font-size:1.08rem}

/* ---- caisse ---- */
.panier .pl{display:grid;grid-template-columns:1fr 64px 92px 36px;gap:6px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--trait)}
.panier .pl .nm{grid-column:1/-1;font-weight:650;display:flex;justify-content:space-between;gap:8px}
.panier .pl input{min-height:40px;padding:6px 8px;text-align:right}
.panier .pl .st{font-size:.8rem;color:var(--doux)}
.panier .pl .x{border:0;background:var(--rouge-p);color:var(--rouge);border-radius:9px;width:36px;height:40px;font-size:1.2rem;font-weight:700}
.encaisse{background:var(--encre);color:#fff;border-radius:var(--r);padding:16px}
.encaisse .tt{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.encaisse .tt b{font-size:2.1rem;font-weight:850;color:var(--mangue);letter-spacing:-.02em}
.encaisse label.ch > span{color:#B9CCC2}
.encaisse input,.encaisse select{background:#1C372E;border-color:#33524A;color:#fff}
.encaisse .info{margin:2px 0 12px;font-weight:700;min-height:1.4em}
.encaisse .info.cr{color:#FFB4AA} .encaisse .info.mo{color:#9FE3C3}
@media(min-width:900px){.caisse2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:start}.caisse2 .encaisse{position:sticky;top:76px}}

/* ---- ticket ---- */
.ticket{background:#fff;color:#111;padding:18px 16px 22px;font-size:.92rem;margin:0 auto;max-width:340px;filter:drop-shadow(0 2px 6px rgba(16,38,31,.18));
  -webkit-mask:radial-gradient(circle 6px at 8px 100%,transparent 98%,#000) -8px 0/16px 100%;mask:radial-gradient(circle 6px at 8px 100%,transparent 98%,#000) -8px 0/16px 100%}
.ticket h3{text-align:center;font-size:1.1rem;font-weight:800}
.ticket .ce{text-align:center;font-size:.82rem;color:#444}
.ticket hr{border:0;border-top:1px dashed #999;margin:10px 0}
.ticket .tl{display:flex;justify-content:space-between;gap:10px}
.ticket .tl.g{font-weight:800;font-size:1.05rem}
.ticket .q{font-size:.82rem;color:#444}

/* ---- fenêtres, messages ---- */
#modale{position:fixed;inset:0;z-index:60;background:rgba(16,38,31,.5);display:flex;align-items:flex-end;justify-content:center}
#modale .boite{background:var(--fond);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));animation:monte .2s ease-out}
#modale .boite > header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
#modale .ferme{border:0;background:var(--trait);border-radius:99px;width:36px;height:36px;font-size:1.2rem;flex:none}
@media(min-width:700px){#modale{align-items:center}#modale .boite{border-radius:20px}}
@keyframes monte{from{transform:translateY(24px);opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + 18px);transform:translateX(-50%);z-index:80;background:var(--encre);color:#fff;padding:11px 16px;border-radius:12px;font-weight:600;max-width:92vw;text-align:center;box-shadow:0 6px 20px rgba(16,38,31,.3)}
#toast.err{background:var(--rouge)}

/* ---- écrans d'entrée ---- */
.porte{min-height:100vh;display:grid;place-items:center;padding:24px 18px;background:var(--encre);color:#fff}
.porte .in{width:100%;max-width:400px}
.porte .marque{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.porte .marque svg{width:52px;height:52px}
.porte .marque b{font-size:1.7rem;font-weight:850;letter-spacing:-.02em}
.porte .marque span{display:block;font-size:.82rem;color:#B9CCC2}
.porte .carte{color:var(--encre)}
.porte p.ex{color:#C9D8D0;margin-bottom:16px}
.code{font:800 1.9rem/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-align:center;background:var(--mangue-p);border:1.5px dashed var(--mangue);border-radius:12px;padding:14px 8px;margin:6px 0 10px;user-select:all}
.pin{display:flex;gap:10px;justify-content:center;margin:14px 0}
.pin i{width:16px;height:16px;border-radius:50%;border:2px solid var(--encre)} .pin i.on{background:var(--encre)}
.clavier{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.clavier button{border:1px solid var(--trait);background:var(--surface);border-radius:14px;min-height:58px;font-size:1.4rem;font-weight:700}
.clavier button:active{background:var(--vert-p)}
#lance{position:fixed;inset:0;z-index:99;background:var(--encre);display:grid;place-items:center;transition:opacity .35s}
#lance svg{width:92px;height:92px}
#lance rect.c{transform-box:fill-box;transform-origin:center;animation:pose .5s cubic-bezier(.2,1.4,.4,1) both}
#lance rect.c:nth-of-type(3){animation-delay:.12s} #lance rect.c:nth-of-type(4){animation-delay:.24s}
@keyframes pose{from{transform:translateY(-40px);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media print{
  body{background:#fff} #app,.nav,#toast,#lance{display:none!important}
  #modale{position:static;background:none;display:block} #modale .boite{max-height:none;padding:0;background:#fff}
  #modale .boite > header,#modale .nonimp{display:none!important}
  .ticket{filter:none;-webkit-mask:none;mask:none;max-width:none}
}
.reseau{flex:none;font-size:.74rem;font-weight:700;border-radius:99px;padding:5px 10px;background:rgba(159,227,195,.16);color:#9FE3C3;white-space:nowrap}
.reseau::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor;margin-right:6px}
.reseau.off{background:rgba(242,164,19,.2);color:#F2A413}
.reseau.ko{background:rgba(255,180,170,.18);color:#FFB4AA}
.tete .moi{max-width:30vw}
.porte .liste{color:var(--encre)}
.porte .contact{margin-top:22px;padding-top:14px;border-top:1px solid rgba(255,255,255,.18);display:grid;gap:6px;font-size:.88rem;color:#C9D8D0}
.porte .contact a{color:#fff;font-weight:700;font-size:1rem;text-decoration:none;overflow-wrap:anywhere}
.contact a.dl{margin-top:6px;color:#F2A413!important;text-decoration:underline!important;font-size:.95rem!important}
@media (display-mode: standalone),(display-mode: fullscreen){.contact a.dl{display:none}}
.porte .liste .ligne{min-height:64px;font-size:1.05rem}
.porte .liste .ligne::after{content:"›";font-size:1.5rem;color:var(--doux)}
.facture{background:#fff;color:#111;padding:18px 16px;font-size:.84rem;line-height:1.35;border:1px solid var(--trait);border-radius:6px}
.f-ent{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.f-logo{max-width:90px;max-height:70px;object-fit:contain;flex:none}
.f-nom{font-weight:800;font-size:1.08rem}
.f-haut{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.f-infos{background:#F1F1F1;border-collapse:collapse;flex:1.3}
.f-infos td{padding:2px 8px;vertical-align:top}
.f-infos td:first-child{text-align:right;color:#333;white-space:nowrap}
.f-dest{flex:1;min-width:120px}
.f-titre{text-align:right;font-weight:800;font-size:1.15rem;margin:6px 0 10px}
.f-tab{width:100%;border-collapse:collapse;border:1.5px solid #111}
.f-tab th{background:#C9DAF0;border:1.5px solid #111;padding:6px;font-size:.8rem}
.f-tab td{border-left:1.5px solid #111;border-right:1.5px solid #111;padding:4px 6px;vertical-align:top}
.f-tab .c{text-align:center}
.f-tab .d{text-align:right}
.f-tab tr.vide td{height:80px}
.f-tab tr.court td{height:30px}
.traits-fact .f-tab tbody tr:not(.vide):not(.court) td{border-bottom:1px solid #111}
.f-tab.traitsL td{border-bottom:1px solid #111}
.invl{align-items:center}.invl .f>span{display:block}.invl .invE{margin-top:3px}.invl .invE .etiq{display:inline-block;width:auto}
.invQ{width:96px;flex:none;text-align:right;font-size:1.05rem;padding:9px 10px;border:1.5px solid var(--trait);border-radius:10px;background:#fff;color:inherit}.invQ:focus{border-color:var(--vert);outline:none}.invQ.err{border-color:var(--rouge)}
.cloche{position:relative;flex:none;width:38px;height:38px;border:0;border-radius:99px;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;padding:0}.cloche svg{width:20px;height:20px}
.cloche b{position:absolute;top:-3px;right:-3px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--mangue);color:var(--encre);font-size:.7rem;line-height:19px;font-weight:800;text-align:center;border:2px solid var(--encre)}
.cloche.neuf svg{animation:sonne 1.6s ease 1}@keyframes sonne{0%,100%{transform:rotate(0)}15%{transform:rotate(14deg)}30%{transform:rotate(-12deg)}45%{transform:rotate(8deg)}60%{transform:rotate(-5deg)}}
.cloche.neuf b{animation:pastille .5s cubic-bezier(.2,1.5,.4,1) 1}@keyframes pastille{from{transform:scale(0);opacity:0}60%{transform:scale(1.25)}to{transform:scale(1)}}
.cloche.neuf::after{content:"";position:absolute;inset:0;border-radius:99px;border:2px solid var(--mangue);animation:onde 1.2s ease-out 2;pointer-events:none}
@keyframes onde{from{transform:scale(1);opacity:.7}to{transform:scale(1.85);opacity:0}}
#modale .notif{animation:notifEntre .32s cubic-bezier(.2,.9,.3,1) both}
@keyframes notifEntre{from{opacity:0;transform:translateY(12px)}}
@media (prefers-reduced-motion:reduce){.cloche.neuf svg,.cloche.neuf b,.cloche.neuf::after,#modale .notif{animation:none}}
.liste.rel .rl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:start;padding:12px 14px;border-bottom:1px solid var(--trait)}
.liste.rel .rl:last-child{border-bottom:0}
.liste.rel .rl .f{min-width:0}
.liste.rel .rl .f b{display:block;font-weight:650}
.liste.rel .rl .f span{display:block;font-size:.82rem;color:var(--doux)}
.liste.rel .rl .f .etiq{display:inline-block;margin-top:3px}
.liste.rel .rl .d{text-align:right}
.liste.rel .rl .rb{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.liste.rel .rl .rb .btn{flex:0 0 auto}
.notif{border-left:5px solid var(--vert);margin-bottom:10px;padding:12px 14px}.notif.al{border-left-color:var(--mangue)}.notif.ko{border-left-color:var(--rouge)}.notif.vue{opacity:.65}
.notif .nt b{display:block}.notif .nt span{display:block;font-size:.84rem;color:var(--doux);margin-top:2px}.notif .nb{margin-top:10px;justify-content:flex-start;gap:8px}.notif .nb:empty{display:none}
.notif .majl{margin:8px 0 0;padding-left:18px;display:grid;gap:5px;font-size:.88rem}
